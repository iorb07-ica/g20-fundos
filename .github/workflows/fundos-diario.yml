name: Fundos (CVM) diário
# Atualiza cotas e cadastro dos fundos de investimento (dados abertos da CVM) e publica no Pages do g20-fundos.
# Horários de Brasília: 09:30 (seg a sáb) e 20:30 (seg a sex). Repositório público: minutos grátis.
on:
  schedule:
    - cron: '30 12 * * 1-6'
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
    inputs:
      modo:
        description: 'normal ou completo (refaz o histórico mensal desde 2010)'
        default: 'normal'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: fundos-diario
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Chave do cache (troca uma vez por mês)
        id: mes
        run: echo "m=$(date -u -d '3 months ago' +%Y%m)" >> "$GITHUB_OUTPUT"

      - name: Cache dos arquivos antigos da CVM
        uses: actions/cache@v4
        with:
          path: cache
          key: cvm-arq-${{ steps.mes.outputs.m }}
          restore-keys: cvm-arq-

      - name: Trazer os dados já publicados (branch dados)
        run: |
          git clone --depth 1 --branch dados "https://github.com/${GITHUB_REPOSITORY}.git" pub || mkdir -p pub
          rm -rf pub/.git

      - name: Atualizar
        env:
          MODO: ${{ github.event.inputs.modo || 'normal' }}
          OUT: pub
          CACHE: cache
        run: python scripts/atualizar_fundos.py

      - name: Gravar na branch dados (sem histórico, para o repositório não inchar)
        run: |
          cd pub
          touch .nojekyll
          git init -q -b dados
          git config user.name "G20 Fundos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Dados de $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" dados
          du -sh .
          rm -rf .git

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pub

      - id: deploy
        uses: actions/deploy-pages@v4
