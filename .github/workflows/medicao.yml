name: Medição dos dados da CVM
# Fase 0 dos Fundos no G20 Hub: só baixa e mede os dados abertos da CVM.
# Não grava nada no repositório. Roda só pelo botão "Run workflow" na aba Actions.
# Repositório público: minutos do GitHub Actions ilimitados e gratuitos.
on:
  workflow_dispatch:
    inputs:
      ano_hist:
        description: 'Ano antigo para amostra do histórico'
        default: '2015'
permissions:
  contents: write
jobs:
  medir:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Medir
        env:
          ANO_HIST: ${{ github.event.inputs.ano_hist }}
        run: python scripts/medir_cvm.py
      - name: Guardar o relatório para baixar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-medicao
          path: relatorio-medicao.md
          if-no-files-found: ignore
      - name: Gravar o relatório no repositório (pasta relatorios)
        if: always()
        run: |
          mkdir -p relatorios && cp relatorio-medicao.md relatorios/medicao.md || exit 0
          git config user.name "G20 Fundos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relatorios && git commit -m "Relatório da medição" && git pull --rebase origin main && git push origin HEAD:main || true
